name: Riot key health

# Manual only, and deliberately silent.
#
# This used to run on a schedule and open a GitHub issue whenever the key
# stopped authenticating, which on a development key meant mail every day. The
# key is now a permanent one, so there is nothing routine left to report.
#
# What it is still good for: checking the key stored as a repository secret,
# which `npm run key:check` cannot see because that reads .env.local. Run it
# from the Actions tab when you want to know whether scheduled ingests are
# currently able to collect anything.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: key-health
  cancel-in-progress: true

jobs:
  check:
    name: Check the Riot API key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Probe the key
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          set +e
          npm run key:check
          code=$?
          set -e
          # 0 usable, 1 needs rotation, 2 Riot unreachable. Nothing here fails
          # the run: you asked for this check, so the answer is the output, not
          # a red mark and an email.
          case "$code" in
            0) echo "Key is usable — scheduled ingests will collect." ;;
            1) echo "::warning::Key needs rotating. Run 'npm run key:rotate' locally." ;;
            *) echo "::warning::Could not reach Riot; this says nothing about the key." ;;
          esac
