name: Ingest ranked matches

on:
  schedule:
    # Every three hours. Each run is an additive slice; the snapshot for a patch
    # grows across runs rather than being rebuilt from scratch.
    #
    # Budget is sized to finish inside the gap between runs. Five regions at
    # 1000 matches is roughly 5000 requests, and a development key sustains
    # about 50 a minute, so a run lands near 100 minutes against a 180 minute
    # cadence. Overrunning would queue behind the concurrency group and the
    # backlog would never drain.
    #
    # Each run takes the five stalest regions, so all seventeen are covered
    # roughly every ten hours rather than five being kept fresh and the rest
    # never touched.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      regions:
        description: Space-separated platform ids. Leave empty to pick the stalest.
        required: false
        default: ""
      matches:
        description: Match budget per region
        required: false
        default: "1000"
      region_count:
        description: How many of the stalest regions to refresh
        required: false
        default: "5"

# Runs commit to main, so never let two overlap.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Aggregate and commit snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the commit this job creates can be pushed back.
          persist-credentials: true
          # Full history: the commit step rebases onto origin/main before
          # pushing, and a rebase cannot run against the shallow clone
          # actions/checkout takes by default.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the key before spending half an hour on it
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          set +e
          npm run key:check
          code=$?
          set -e
          if [ "$code" = "1" ]; then
            echo "::error::Riot API key is not authenticating — skipping ingest. Run 'npm run key:rotate'."
            exit 1
          fi
          if [ "$code" != "0" ]; then
            echo "::warning::Could not reach Riot to verify the key; attempting the ingest anyway."
          fi

      - name: Ingest each region
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          REGIONS: ${{ inputs.regions }}
          MATCHES: ${{ inputs.matches || '1000' }}
          REGION_COUNT: ${{ inputs.region_count || '5' }}
        run: |
          if [ -z "$RIOT_API_KEY" ]; then
            echo "::error::RIOT_API_KEY secret is not set — nothing to ingest."
            exit 1
          fi

          # No explicit list: refresh whichever shards have gone longest without
          # one. A development key cannot cover seventeen regions every three
          # hours, so the job rotates instead of favouring a fixed few, and a
          # newly supported region fills itself in with no workflow edit.
          if [ -z "$REGIONS" ]; then
            REGIONS=$(npm run --silent stale-regions -- --count "$REGION_COUNT")
            echo "Selected stalest regions: $REGIONS"
          fi
          for region in $REGIONS; do
            echo "::group::$region"
            # Keep going if one shard is unhealthy; the others still contribute.
            npm run ingest -- \
              --region "$region" \
              --bracket master_plus \
              --matches "$MATCHES" \
              --players 60 \
              --per-player 30 || echo "::warning::ingest failed for $region"
            echo "::endgroup::"
          done

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/checkpoints
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "data: refresh ranked snapshots"
          # Another run may have landed while this one was fetching.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
