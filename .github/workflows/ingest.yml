name: Ingest ranked matches

on:
  schedule:
    # Every three hours. Each run is an additive slice; the snapshot for a patch
    # grows across runs rather than being rebuilt from scratch.
    #
    # The budget is deliberately larger than a run can finish. Throughput
    # depends on which tier of key is installed — the rate limiter reads its
    # allowance from Riot's response headers rather than assuming one — so
    # rather than guessing a match count that fits, the ingest step is given a
    # wall-clock limit and collects whatever fits inside it. Snapshots flush
    # every 100 matches and are committed even when the step is cut short, so
    # a faster key simply collects more per run with no change here.
    #
    # Each run takes the stalest regions, so all of them are covered in
    # rotation rather than a few being kept fresh and the rest never touched.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      regions:
        description: Space-separated platform ids. Leave empty to pick the stalest.
        required: false
        default: ""
      matches:
        description: Match budget per region
        required: false
        default: "4000"
      region_count:
        description: How many of the stalest regions to refresh
        required: false
        default: "6"

# Runs commit to main, so never let two overlap.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Aggregate and commit snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the commit this job creates can be pushed back.
          persist-credentials: true
          # Full history: the commit step rebases onto origin/main before
          # pushing, and a rebase cannot run against the shallow clone
          # actions/checkout takes by default.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A key that has stopped authenticating is an expected condition, not a
      # broken build — failing here turned every three-hourly run red and mailed
      # about it each time. The run skips cleanly instead and resumes on its own
      # once the key works, since ingestion is additive.
      - name: Check the key before spending half an hour on it
        id: key
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          # A missing secret is a misconfiguration, not a lapsed key, and it
          # will never fix itself — so that one still fails loudly.
          if [ -z "$RIOT_API_KEY" ]; then
            echo "::error::RIOT_API_KEY secret is not set — nothing to ingest."
            exit 1
          fi

          set +e
          npm run key:check
          code=$?
          set -e
          if [ "$code" = "1" ]; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Riot API key is not authenticating — skipping this ingest. Run 'npm run key:rotate'."
          else
            echo "usable=true" >> "$GITHUB_OUTPUT"
            if [ "$code" != "0" ]; then
              echo "::warning::Could not reach Riot to verify the key; attempting the ingest anyway."
            fi
          fi

      # Collect for a fixed stretch rather than a fixed match count. Being cut
      # off here is the normal ending, not a failure: snapshots flush every 100
      # matches and the commit step runs regardless, so whatever was gathered is
      # kept and the next run resumes from the checkpoint.
      - name: Ingest each region
        if: steps.key.outputs.usable == 'true'
        timeout-minutes: 140
        continue-on-error: true
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          REGIONS: ${{ inputs.regions }}
          MATCHES: ${{ inputs.matches || '4000' }}
          REGION_COUNT: ${{ inputs.region_count || '6' }}
        run: |
          # No explicit list: refresh whichever shards have gone longest without
          # one. No key can cover every region every three hours, so the job
          # rotates instead of favouring a fixed few, and a newly supported
          # region fills itself in with no workflow edit.
          if [ -z "$REGIONS" ]; then
            REGIONS=$(npm run --silent stale-regions -- --count "$REGION_COUNT")
            echo "Selected stalest regions: $REGIONS"
          fi
          for region in $REGIONS; do
            echo "::group::$region"
            # Keep going if one shard is unhealthy; the others still contribute.
            npm run ingest -- \
              --region "$region" \
              --bracket master_plus \
              --matches "$MATCHES" \
              --players 200 \
              --per-player 40 || echo "::warning::ingest failed for $region"
            echo "::endgroup::"
          done

      # always(), so a timed-out ingest still publishes what it collected.
      - name: Commit updated snapshots
        if: always() && steps.key.outputs.usable == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/checkpoints
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "data: refresh ranked snapshots"
          # Another run may have landed while this one was fetching.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
